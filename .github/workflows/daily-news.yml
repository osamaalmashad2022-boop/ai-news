name: Daily AI News Automation

on:
  schedule:
    # Runs every morning at 05:00 UTC (08:00 AM Egypt time)
    - cron: '0 5 * * *'
    # Runs every evening at 17:00 UTC (20:00 PM Egypt time)
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Ingest Script (Fetch + Gemini Summarize)
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ingest.mjs

      - name: Validate content before committing
        run: node scripts/validate.mjs

      - name: Commit and push new content files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/news/ src/content/tools/ scripts/history.json
          if git diff --staged --quiet; then
            echo "No new news articles to commit today."
          else
            git commit -m "chore(news): auto-update daily AI news articles"
            git push
          fi

      - name: Trigger Vercel Redeploy
        if: success()
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK"
            echo "✅ Vercel redeploy triggered."
          else
            echo "ℹ️ No VERCEL_DEPLOY_HOOK secret found, skipping redeploy."
          fi
